[GCPad1]
Device = SDL/0/#controller_xbox360
Buttons/A = `Button B`
Buttons/B = `Button A`
Buttons/X = `Button Y`
Buttons/Y = `Button X`
Buttons/Start = Start
Main Stick/Up = `Left Y+`
Main Stick/Down = `Left Y-`
Main Stick/Left = `Left X-`
Main Stick/Right = `Left X+`
Main Stick/Modifier = `Thumb L`
C-Stick/Up = `Right Y+`
C-Stick/Down = `Right Y-`
C-Stick/Left = `Right X-`
C-Stick/Right = `Right X+`
C-Stick/Modifier = `Thumb R`
Triggers/L = `Trigger L`|`Shoulder L`
Triggers/R = `Trigger R`|`Shoulder R`
D-Pad/Up = (deadzone(`Left Y-`, -0.5)&(pulse((`Trigger R`|`Shoulder R`), 0.12)))|`Pad N`
D-Pad/Down = (deadzone(`Left Y+`, -0.5)&(pulse((`Trigger R`|`Shoulder R`), 0.12)))|`Pad S`|if(!(`Left Y+`|`Left Y-`|`Left X+`|`Left X-`), (pulse((`Trigger R`|`Shoulder R`), 0.12)), 0)
D-Pad/Left = (deadzone(`Left X-`, -0.5)&(pulse((`Trigger R`|`Shoulder R`), 0.12)))|`Pad W`
D-Pad/Right = (deadzone(`Left X+`, -0.5)&(pulse((`Trigger R`|`Shoulder R`), 0.12)))|`Pad E`
Rumble/Motor = `Motor L``Motor R`

